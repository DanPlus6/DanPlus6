name: Update github stat cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch: 
  push:
    paths:
      - ".github/workflows/github-readme-stats.yml" # Run any time this file is modified
      
concurrency:
  group: update-github-stats
  cancel-in-progress: false
    
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&include_all_commits=false&count_private=true&show_icons=true&title_color=fff&icon_color=00e7ff&text_color=9f9f9f&bg_color=101010&border_color=35373a
          path: assets/gh-stat.svg
          token: ${{ secrets.README_STAT_PAT }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&langs_count=8&layout=compact&title_color=fff&text_color=00e7ff&bg_color=101010&border_color=35373a&hide=html,css,scss,jupyter%20notebook
          path: assets/gh-stat-top-langs.svg
          token: ${{ secrets.README_STAT_PAT }}
  
      - name: Generate pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=RGSS-CS
          path: assets/gh-stat-org.svg
          token: ${{ secrets.README_STAT_PAT }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add assets/gh-stat*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update README stat cards"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
