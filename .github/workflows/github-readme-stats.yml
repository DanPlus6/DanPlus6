name: Update github stat cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch: 
  push:
    paths:
      - ".github/workflows/github-readme-stats.yml" # Run any time this file is modified
      
concurrency:
  group: update-github-stats
  cancel-in-progress: false
    
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}${{ vars.STAT_CARD_OPTIONS }}
          path: ${{ vars.ASSETS_DIR }}/${{ vars.README_STAT_PREFIX }}.svg
          token: ${{ secrets.README_STAT_PAT }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}${{ vars.LANGS_CARD_OPTIONS }}
          path: ${{ vars.ASSETS_DIR }}/${{ vars.README_STAT_PREFIX }}-top-langs.svg
          token: ${{ secrets.README_STAT_PAT }}
  
      # - name: Generate pin card
      #   uses: stats-organization/github-readme-stats-action@v2
      #   with:
      #     card: pin
      #     options: username=RGSS-RBTCS&repo=robot.rgsscs.org
      #     path: assets/gh-stat-org.svg
      #     token: ${{ secrets.README_STAT_PAT }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add ${{ vars.ASSETS_DIR }}/${{ vars.README_STAT_PREFIX }}*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update README stat card(s)"

          git fetch origin
          git rebase origin/main
          git push origin main
