name: Update github streak stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/github-streak-stats.yml" # Run any time this file is modified

concurrency:
  group: update-github-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=black-ice&hide_border=false&background=101010&border=35373a #&disable_animations=true
          path: assets/gh-streak-stats.svg
          token: ${{ secrets.README_STAT_PAT }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add assets/gh-stat*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update README stat cards"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          
          git push
